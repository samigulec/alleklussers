<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linejoin="miter" stroke-linecap="round">
  <!-- House + lightning bolt drawn as ONE continuous closed silhouette.
       Clockwise from the roof apex:
       apex → bolt upper-right → waist inner notch → waist outer kick
       → bolt bottom tip → back up to house bottom-right
       → house bottom → house left wall → close back to apex (roof slope) -->
  <path d="M 55 14 L 82 42 L 62 48 L 78 56 L 42 94 L 56 80 L 16 80 L 16 36 Z" />
  <!-- Plug prongs -->
  <line x1="28" y1="44" x2="28" y2="52" />
  <line x1="38" y1="44" x2="38" y2="52" />
  <!-- Plug body -->
  <rect x="22" y="52" width="22" height="16" />
  <!-- Plug cord curving out and right -->
  <path d="M 33 68 C 33 80 38 83 46 83" stroke-linecap="round" />
</svg>
